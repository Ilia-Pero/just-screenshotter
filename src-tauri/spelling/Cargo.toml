[package]
name = "screenshotter-spelling"
version = "0.1.0"
edition = "2021"
description = "Spelling mistakes in texts, found by the system"
license = "MIT"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSUserDefaults",
    "NSValue",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
