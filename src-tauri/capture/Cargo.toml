[package]
name = "screenshotter-capture"
version = "0.1.0"
edition = "2021"
description = "The screen the picture is taken from"
license = "MIT"
publish = false

[dependencies]
png = "0.18"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
screenshotter-phrase = { path = "../phrase" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screenshot"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
url = "2"

[lints]
workspace = true
