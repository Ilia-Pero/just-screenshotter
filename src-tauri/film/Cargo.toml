[package]
name = "screenshotter-film"
version = "0.1.0"
edition = "2021"
description = "Filming a part of the screen with sound"
license = "MIT"
publish = false

[dependencies]
screenshotter-phrase = { path = "../phrase" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
futures-util = { version = "0.3", default-features = false }
rustix = { version = "1", features = ["process", "stdio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVCaptureAudioDataOutput",
    "AVCaptureDevice",
    "AVCaptureFileOutput",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGError",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMSync",
    "CMTime",
    "objc2",
    "objc2-core-audio-types",
    "objc2-core-video",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSValue",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
