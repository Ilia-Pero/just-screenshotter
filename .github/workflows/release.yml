name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the version of the program
        run: test "$(jq -r .version src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
      - name: The changes are written down
        run: grep -E "^## $GITHUB_REF_NAME \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## /{on = $2 == tag; next} on' CHANGELOG.md > notes.md
          cat .github/release.md >> notes.md
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --title "Just Screenshotter $GITHUB_REF_NAME" --notes-file notes.md
